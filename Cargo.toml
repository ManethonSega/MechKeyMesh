[workspace]
members = [
  "crates/config",
  "crates/audio-engine",
  "crates/core",
  "crates/driver-api",
  "crates/hid",
  "crates/layout",
  "crates/lcd-engine",
  "crates/lighting-engine",
  "crates/persistence",
  "drivers/aula-f108pro",
  "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.16.0-alpha.1"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/ManethonSega/MechKeyMesh"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
