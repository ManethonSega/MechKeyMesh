name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Core tests
        run: cargo test --workspace --exclude mechkeymesh-desktop
      - name: Clippy
        run: cargo clippy --workspace --exclude mechkeymesh-desktop --all-targets -- -D warnings

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: Workspace tests
        run: cargo test --workspace
      - name: Windows clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Build MechKeyMesh
        run: cargo build -p mechkeymesh-desktop --release
      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "target/release/MechKeyMesh.exe")) {
            throw "MechKeyMesh.exe was not produced"
          }
          Get-Item "target/release/MechKeyMesh.exe" | Format-List Name,Length,LastWriteTime
