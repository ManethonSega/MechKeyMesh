name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go test ./internal/...

  windows-driver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go test ./internal/...

  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Build desktop app
        run: wails build -clean
      - name: Verify Windows executable
        shell: pwsh
        run: |
          if (!(Test-Path "build/bin/MechKeyMesh.exe")) {
            throw "MechKeyMesh.exe was not produced"
          }
          Get-Item "build/bin/MechKeyMesh.exe" | Format-List Name,Length,LastWriteTime
