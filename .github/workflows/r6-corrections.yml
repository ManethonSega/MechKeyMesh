name: R6 Corrections

on:
  push:
    branches: [r6/normal-layer-remapping]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r6/normal-layer-remapping
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - name: Correct remap transaction details
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('drivers/aula-f108pro/src/remap.rs')
          text = path.read_text()
          text = text.replace(
              'send_multi_packet(session, context, &table, true)?;',
              'send_multi_packet(session, context, &table, false)?;'
          )
          text = re.sub(
              r'\s*let packet_count = data\.len\(\) / FEATURE_REPORT_SIZE;\n',
              '\n',
              text,
              count=1,
          )
          text = re.sub(
              r'\s*context\.sleep\(COMMAND_DELAY\)\.map_err\(\|error\| \{.*?\}\)\?;',
              '\n        context.sleep(COMMAND_DELAY)?;',
              text,
              count=1,
              flags=re.S,
          )
          path.write_text(text)
          PY
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Commit corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drivers/aula-f108pro/src/remap.rs
          git commit -m "fix: align R6 data transfer with verified protocol"
          git push origin HEAD:r6/normal-layer-remapping
