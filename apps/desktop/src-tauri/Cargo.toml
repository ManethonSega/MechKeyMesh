[package]
name = "mechkeymesh-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "mechkeymesh_desktop_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "MechKeyMesh"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
mechkeymesh-audio-engine = { path = "../../../crates/audio-engine" }
mechkeymesh-config = { path = "../../../crates/config" }
mechkeymesh-core = { path = "../../../crates/core" }
mechkeymesh-driver-api = { path = "../../../crates/driver-api" }
mechkeymesh-driver-aula-f108pro = { path = "../../../drivers/aula-f108pro" }
mechkeymesh-layout = { path = "../../../crates/layout" }
mechkeymesh-lcd-engine = { path = "../../../crates/lcd-engine" }
mechkeymesh-lighting-engine = { path = "../../../crates/lighting-engine" }
mechkeymesh-persistence = { path = "../../../crates/persistence" }
base64 = "0.22"
image = { version = "0.25", features = ["png"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
rfd = "0.15"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
